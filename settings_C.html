<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Cascade | Settings</title>

  <link rel="stylesheet" href="styles_C.css">

  <style>
    .projects-page {
      min-height: calc(100vh - 75px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .project-panel {
      width: 100%;
      max-width: 480px;
    }

    .project-panel h1 {
      margin-bottom: 12px;
      font-size: 30px;
    }

    .continue-button {
      width: 100%;
      margin-top: 24px;
    }

    .account-name {
      color: var(--muted);
      font-size: 13px;
    }

    .account-id {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    #status {
      padding: 16px 24px;
      color: var(--muted);
      text-align: center;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }
  </style>
</head>

<body data-page="settings">
  <header class="topbar">
    <a class="brand" href="index_C.html">
      <span>≋</span>
      Cascade
    </a>

    <div id="account" class="row" hidden>
      <span
        id="account-name"
        class="account-name"
      ></span>

      <button id="sign-out" type="button">
        Sign out
      </button>
    </div>
  </header>

  <p
    id="status"
    role="status"
    aria-live="polite"
  >
    Checking sign-in…
  </p>

  <!-- Shown after app1.py verifies the Clerk session. -->
  <main
    id="protected-page"
    class="projects-page"
    hidden
  >
    <section class="card project-panel">
      <h1>Video preferences</h1>
      <p class="muted">Save your video type, audience, tone, goal, and platforms. These preferences are stored for your account. Existing processing features do not yet use them to change generated output.</p>
      <form id="settings-form">
        <label for="settings-video-type">Video type</label>
        <select id="settings-video-type"><option value="">Choose a type</option><option value="tutorial">Tutorial</option><option value="vlog">Vlog</option><option value="interview">Interview</option><option value="podcast">Podcast clip</option></select>
        <label for="settings-audience">Audience</label><input id="settings-audience" maxlength="200">
        <label for="settings-tone">Tone</label><select id="settings-tone"><option value="">Choose a tone</option><option value="casual">Casual</option><option value="professional">Professional</option><option value="funny">Funny</option><option value="educational">Educational</option></select>
        <label for="settings-goal">Goal</label><input id="settings-goal" maxlength="500">
        <fieldset><legend>Platforms</legend>
          <label><input type="checkbox" name="platforms" value="tiktok"> TikTok</label>
          <label><input type="checkbox" name="platforms" value="instagram"> Instagram</label>
          <label><input type="checkbox" name="platforms" value="linkedin"> LinkedIn</label>
          <label><input type="checkbox" name="platforms" value="youtube"> YouTube</label>
        </fieldset>
        <button class="primary continue-button" type="submit">Save preferences</button>
      </form>
      <a class="button" href="projects_C.html">Back to projects</a>
    </section>
  </main>

  <noscript>
    <p>Please enable JavaScript to load your settings.</p>
  </noscript>

  <script src="flow_C.js"></script>
</body>
</html>
