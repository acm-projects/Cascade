<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Cascade | Exports</title>

  <link rel="stylesheet" href="styles_C.css">

  <style>
    .exports-page {
      max-width: 900px;
      margin: auto;
      padding: 32px 24px;
    }

    .exports-page h1 {
      margin-bottom: 24px;
      font-size: 30px;
    }

    .export-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 24px;
    }

    .clip-preview {
      display: grid;
      min-height: 220px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #06110d;
      color: var(--muted);
    }

    .placeholder-controls {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .placeholder-controls:disabled {
      opacity: 0.7;
    }

    .export-button {
      width: 100%;
      margin-top: 24px;
    }

    .exports-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    #status {
      padding: 16px 24px;
      color: var(--muted);
      text-align: center;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }

    @media (max-width: 650px) {
      .export-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .exports-page {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body data-page="exports">
  <header class="topbar">
    <a class="brand" href="index_C.html">
      <span>≋</span>
      Cascade
    </a>

    <div id="account" class="row" hidden>
      <span id="account-name" class="muted"></span>

      <button id="sign-out" type="button">
        Sign out
      </button>
    </div>
  </header>

  <p
    id="status"
    role="status"
    aria-live="polite"
  >
    Checking sign-in…
  </p>

  <main
    id="protected-page"
    class="exports-page"
    hidden
  >
    <h1>Exports</h1>

    <div class="export-layout">
      <section class="card">
        <div class="clip-preview">
          Finished clip preview
        </div>

        <h3>Clip 1</h3>

        <p class="muted">
          Exporting is not connected yet.
        </p>
      </section>

      <section class="card">
        <h3>Export settings</h3>

        <fieldset class="placeholder-controls" disabled>
          <label for="export-format">
            Format
          </label>

          <select id="export-format">
            <option>MP4</option>
            <option>MOV</option>
          </select>

          <label for="export-resolution">
            Resolution
          </label>

          <select id="export-resolution">
            <option>1080p</option>
            <option>720p</option>
          </select>

          <label>
            <input type="checkbox" checked>
            Include captions
          </label>

          <button
            class="primary export-button"
            type="button"
            disabled
          >
            Export clip
          </button>
        </fieldset>
      </section>
    </div>

    <div class="exports-footer">
      <a class="button" href="editor_C.html">
        ← Back to editor
      </a>

      <a class="button primary" href="projects_C.html">
        Back to projects →
      </a>
    </div>
  </main>

  <noscript>
    <p>Please enable JavaScript to open exports.</p>
  </noscript>

  <script src="flow_C.js"></script>
</body>
</html>
