<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Clip Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      color: #17345c;
      background: linear-gradient(135deg, #eaf3ff, #a8ceff);
    }

    main {
      max-width: 750px;
      margin: auto;
      padding: 35px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 15px 40px rgba(27, 75, 139, 0.15);
    }

    h1 {
      margin: 0 0 5px;
      color: #1265c8;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #587096;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #b9cce6;
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    button {
      margin-top: 22px;
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #1265c8;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    video {
      display: block;
      width: 100%;
      max-height: 450px;
      margin-top: 15px;
      border-radius: 10px;
      background: #111;
    }

    [hidden] {
      display: none !important;
    }

    #status {
      margin-top: 18px;
      color: #587096;
      line-height: 1.5;
    }

    #result {
      margin-top: 30px;
    }

    .clip-card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #edf5ff;
    }

    .clip-card h3 {
      margin: 0 0 10px;
      color: #1265c8;
    }

    .clip-card p {
      line-height: 1.5;
    }

    .clip-details {
      font-size: 14px;
      color: #587096;
    }
  </style>
</head>

<body>
  <main>
    <h1>Cascade</h1>
    <p class="subtitle">
      Search your video and create clips with captions
      and an explanation of each match.
    </p>

    <label for="videoFile">1. Choose a video</label>
    <input id="videoFile" type="file" accept="video/*">

    <video id="videoPreview" controls hidden></video>

    <label for="searchInput">2. What moment do you want to find?</label>
    <input
      id="searchInput"
      type="text"
      placeholder="Example: a girl having accidents"
    >

    <label for="searchMode">3. Search using</label>
    <select id="searchMode">
      <option value="speech">Spoken words</option>
      <option value="visual">What appears on screen</option>
      <option value="both">Both — 2 spoken + 2 visual</option>
    </select>

    <label for="clipLength">4. Length of each clip</label>
    <select id="clipLength">
      <option value="15">15 seconds</option>
      <option value="30">30 seconds</option>
      <option value="60">60 seconds</option>
    </select>

    <button id="findButton" type="button">
      Find and create 4 clips
    </button>

    <p id="status" role="status"></p>

    <section id="result" hidden>
      <h2>Your clips</h2>
      <div id="clipResults"></div>
    </section>
  </main>

  <script>
    const videoFile = document.getElementById("videoFile");
    const videoPreview = document.getElementById("videoPreview");
    const searchInput = document.getElementById("searchInput");
    const searchMode = document.getElementById("searchMode");
    const clipLength = document.getElementById("clipLength");
    const findButton = document.getElementById("findButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const clipResults = document.getElementById("clipResults");

    let previewUrl = null;

    videoFile.addEventListener("change", () => {
      const file = videoFile.files[0];

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      videoPreview.pause();
      videoPreview.removeAttribute("src");
      videoPreview.load();
      videoPreview.hidden = true;

      result.hidden = true;
      clipResults.innerHTML = "";
      status.textContent = "";

      if (file) {
        previewUrl = URL.createObjectURL(file);
        videoPreview.src = previewUrl;
        videoPreview.hidden = false;
      }
    });

    findButton.addEventListener("click", async () => {
      const file = videoFile.files[0];
      const search = searchInput.value.trim();
      const selectedMode = searchMode.value;

      if (!file) {
        status.textContent = "Choose a video first.";
        return;
      }

      if (!search) {
        status.textContent = "Type what you want to find.";
        return;
      }

      const formData = new FormData();
      formData.append("video", file);
      formData.append("search", search);
      formData.append("mode", selectedMode);
      formData.append("clip_length", clipLength.value);

      findButton.disabled = true;
      result.hidden = true;
      clipResults.innerHTML = "";
      status.textContent =
        "Finding and rendering clips... This may take a few minutes.";

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const responseText = await response.text();

        if (!responseText) {
          throw new Error(
            "The server returned an empty response. Check the Terminal."
          );
        }

        let data;
        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "The server returned an error. Check the VS Code Terminal."
          );
        }

        if (!response.ok) {
          const detail = typeof data.detail === "string"
            ? data.detail
            : "Could not create the clips.";
          throw new Error(detail);
        }

        if (!Array.isArray(data.clips) || data.clips.length === 0) {
          throw new Error("The server did not return any clips.");
        }

        data.clips.forEach((clip, index) => {
          const card = document.createElement("div");
          card.className = "clip-card";

          const clipMode = clip.mode ||
            (selectedMode === "both"
              ? (index < 2 ? "speech" : "visual")
              : selectedMode);

          const title = document.createElement("h3");

          // Use a unique title if the backend provides one.
          // Otherwise, label the clip with the search phrase.
          title.textContent = clip.title ||
            `Clip ${index + 1}: ${search}`;

          const description = document.createElement("p");

          if (clip.description) {
            description.textContent = clip.description;
          } else if (clipMode === "speech") {
            description.textContent =
              "Selected because the spoken words were similar " +
              `to your request. Matched speech: “${clip.match}”`;
          } else {
            description.textContent =
              "Selected because a sampled image in this section " +
              `was similar to your request: “${search}”.`;
          }

          const details = document.createElement("p");
          details.className = "clip-details";
          details.textContent =
            `${clip.start}s–${clip.end}s · ` +
            `${clipMode === "speech" ? "Spoken" : "Visual"} match · ` +
            `${clip.style} captions`;

          const player = document.createElement("video");
          player.controls = true;
          player.preload = "metadata";
          player.src = clip.clip_url;

          card.append(title, description, details, player);
          clipResults.appendChild(card);
        });

        result.hidden = false;
        status.textContent =
          `${data.clips.length} clips are ready!`;
      } catch (error) {
        status.textContent =
          `Something went wrong: ${error.message}`;
      } finally {
        findButton.disabled = false;
      }
    });
  </script>
</body>
</html>
