<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cascade Clip Finder</title>
</head>
<body>
  <h1>Cascade Clip Finder</h1>

  <input id="video" type="file" accept="video/mp4">
  <input id="query" type="text" placeholder="What moment are you looking for?">
  <button onclick="generateClips()">Generate 4 Clips</button>

  <p id="status"></p>
  <div id="results"></div>

  <script>
    async function generateClips() {
      const video = document.getElementById("video").files[0];
      const query = document.getElementById("query").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!video || !query) {
        status.textContent = "Choose an MP4 and enter a search phrase.";
        return;
      }

      const form = new FormData();
      form.append("video", video);
      form.append("query", query);

      status.textContent = "Making clips... this may take a few minutes.";
      results.innerHTML = "";

      try {
        const response = await fetch("/generate-clips", {
          method: "POST",
          body: form
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Something went wrong.");
        }

        status.textContent = `Done! Generated ${data.clips.length} clips.`;

        data.clips.forEach((url, index) => {
          const heading = document.createElement("h3");
          heading.textContent = `Clip ${index + 1}`;

          const player = document.createElement("video");
          player.controls = true;
          player.width = 320;
          player.src = url;

          results.append(heading, player);
        });
      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
