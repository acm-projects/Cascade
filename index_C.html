<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Cascade | Home</title>

  <link rel="stylesheet" href="styles_C.css">

  <style>
    .home {
      min-height: calc(100vh - 75px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .home-card {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      text-align: center;
    }

    .waterfall-logo {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: var(--panel2);
      color: var(--teal);
      font-size: 46px;
    }

    .home-card h1 {
      margin-bottom: 12px;
    }

    .home-card p {
      margin-bottom: 28px;
    }

    .home-card .button {
      width: 100%;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index_C.html">
      <span>≋</span>
      Cascade
    </a>
  </header>

  <main class="home">
    <section class="card home-card">
      <div class="waterfall-logo" aria-hidden="true">
        ≋
      </div>

      <h1>Cascade</h1>

      <p class="muted">
        Upload a video, find clips, and edit them.
      </p>

      <a
        class="button primary"
        href="login_C.html"
      >
        Get started →
      </a>
    </section>
  </main>
</body>
</html>
