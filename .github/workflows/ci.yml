name: CI

on:
  pull_request:
  push:
    branches: [main, edit_updated]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CASCADE_WARM_MODELS: '0'
      CASCADE_STORAGE: local
      CASCADE_METADATA_STORE: local
      CASCADE_BROWSER_TESTS: '0'
      CASCADE_DEV_AUTH: '0'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Captions need libass (the ass/subtitles filters) and the AI Editor draws text (drawtext).
      - name: Check FFmpeg has libass and drawtext
        run: |
          filters="$(ffmpeg -hide_banner -filters)"
          for f in ass subtitles drawtext; do
            echo "$filters" | grep -qE "^ [A-Z.]+ $f " || { echo "FFmpeg is missing the $f filter"; exit 1; }
          done
          ffmpeg -hide_banner -version | head -1
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Application regression tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -q
      - name: Agent unittest tests
        run: python -m unittest discover -s tests/agent -q
      # Most agent suites use pytest functions, which unittest discovery doesn't execute.
      - name: Agent pytest tests
        run: python -m pytest tests/agent -q
      - name: Legacy JavaScript regressions
        run: node --test tests/javascript/*.cjs

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build
