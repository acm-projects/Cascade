name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CASCADE_WARM_MODELS: '0'
      CASCADE_STORAGE: local
      CASCADE_METADATA_STORE: local
      CASCADE_BROWSER_TESTS: '0'
      CASCADE_DEV_AUTH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Application regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Agent unittest tests
        run: python -m unittest discover -s backend/tests -q
      # Most agent suites use pytest functions, which unittest discovery doesn't execute.
      - name: Agent pytest tests
        run: python -m pytest backend/tests -q
      - name: Editor state, editor flow and canvas logic
        run: |
          node tests/test_editor_state.cjs
          node tests/test_editor_flow.cjs
          node tests/test_canvas_branches.cjs

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build
